run-name: Build and push patchwork.io dashboard OVH Harbor image by @${{ github.actor }}

on:
  push:
    branches:
      - production-deployment
  workflow_dispatch:

# Store the patchwork.io dashboard robot account's secret in the PATCHWORK_IO_HARBOR_PASSWORD
# ORGANIZATION secret; its repository access must include this repo. Never commit it.
env:
  PATCHWORK_IO_HARBOR_REGISTRY: 44eda7q3.gra7.container-registry.ovh.net
  PATCHWORK_IO_HARBOR_PROJECT: patchwork-io
  PATCHWORK_IO_HARBOR_USERNAME: robot$patchwork-io+patchwork-io
  PATCHWORK_IO_COMPOSE_SOURCE_FILE: docker-compose.ovh.yml
  PATCHWORK_IO_DASHBOARD_IMAGE_TAG: dashboard-${{ github.sha }}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-dashboard:
    name: Build and push dashboard image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to OVH Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.PATCHWORK_IO_HARBOR_REGISTRY }}
          username: ${{ env.PATCHWORK_IO_HARBOR_USERNAME }}
          password: ${{ secrets.PATCHWORK_IO_HARBOR_PASSWORD }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache-dashboard
          key: ${{ runner.os }}-buildx-dashboard-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-dashboard-
            ${{ runner.os }}-buildx-

      - name: Build and push dashboard image
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          IMAGE=${{ env.PATCHWORK_IO_HARBOR_REGISTRY }}/${{ env.PATCHWORK_IO_HARBOR_PROJECT }}/dashboard
          docker buildx build \
            --platform linux/amd64 \
            --cache-from type=local,src=/tmp/.buildx-cache-dashboard \
            --cache-to type=local,dest=/tmp/.buildx-cache-dashboard-new,mode=max \
            --build-arg SOURCE_COMMIT="${SOURCE_COMMIT}" \
            --tag $IMAGE:${{ env.PATCHWORK_IO_DASHBOARD_IMAGE_TAG }} \
            --tag $IMAGE:latest \
            --push \
            .
          rm -rf /tmp/.buildx-cache-dashboard
          mv /tmp/.buildx-cache-dashboard-new /tmp/.buildx-cache-dashboard

  deploy-compose:
    name: Update compose file image tag and deploy to OVH
    runs-on: ubuntu-latest
    needs: build-dashboard
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Replace dashboard image tag in compose file
        run: |
          sed -i 's|image: .*/patchwork-io/dashboard:.*|image: ${{ env.PATCHWORK_IO_HARBOR_REGISTRY }}/${{ env.PATCHWORK_IO_HARBOR_PROJECT }}/dashboard:${{ env.PATCHWORK_IO_DASHBOARD_IMAGE_TAG }}|' ${{ env.PATCHWORK_IO_COMPOSE_SOURCE_FILE }}

      - name: Copy compose file to OVH server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.PATCHWORK_IO_SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          source: ${{ env.PATCHWORK_IO_COMPOSE_SOURCE_FILE }}
          target: /home/ubuntu/deployment/dashboard/
          strip_components: 0
          overwrite: true

      - name: Deploy on OVH server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.PATCHWORK_IO_SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /home/ubuntu/deployment/dashboard
            echo "${{ secrets.PATCHWORK_IO_HARBOR_PASSWORD }}" | docker login "${{ env.PATCHWORK_IO_HARBOR_REGISTRY }}" -u '${{ env.PATCHWORK_IO_HARBOR_USERNAME }}' --password-stdin
            docker compose -f docker-compose.ovh.yml pull
            docker compose -f docker-compose.ovh.yml up -d
            docker compose -f docker-compose.ovh.yml ps
